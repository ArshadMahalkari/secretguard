AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31

Description: SecretGuard - GitHub secret exposure detection

Globals:
  Function:
    Runtime: python3.12
    Timeout: 10
    MemorySize: 256

Parameters:
  SecretGuardConfigArn:
    Type: String
    Description: ARN of Secrets Manager secret containing github_token and webhook_secret

  AlertEmail:
    Type: String
    Description: Email address for remediation alerts

  ProtectedUsers:
    Type: String
    Default: ''
    Description: Comma-separated IAM usernames that SecretGuard must never disable

Resources:

  SecretGuardApi:
    Type: AWS::Serverless::Api
    Properties:
      StageName: prod

  FindingsTable:
    Type: AWS::DynamoDB::Table
    Properties:
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: finding_id
          AttributeType: S
      KeySchema:
        - AttributeName: finding_id
          KeyType: HASH

  RemediationTopic:
    Type: AWS::SNS::Topic
    Properties:
      DisplayName: SecretGuard remediation recommendations

  RemediationSubscription:
    Type: AWS::SNS::Subscription
    Properties:
      Endpoint: !Ref AlertEmail
      Protocol: email
      TopicArn: !Ref RemediationTopic

  SecretGuardBus:
    Type: AWS::Events::EventBus
    Properties:
      Name: SecretGuardBus

  # -----------------------------------------
  # GitHub Webhook
  # -----------------------------------------

  WebhookFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: src/webhook/
      Handler: app.lambda_handler

      Environment:
        Variables:
          SECRET_ARN: !Ref SecretGuardConfigArn
          EVENT_BUS_NAME: !Ref SecretGuardBus

      Policies:
        - Statement:
            - Effect: Allow
              Action:
                - secretsmanager:GetSecretValue
              Resource: !Ref SecretGuardConfigArn

            - Effect: Allow
              Action:
                - events:PutEvents
              Resource: !GetAtt SecretGuardBus.Arn

      Events:
        GitHubWebhook:
          Type: Api
          Properties:
            RestApiId: !Ref SecretGuardApi
            Path: /webhook
            Method: POST

  # -----------------------------------------
  # Secret Scanner
  # -----------------------------------------

  ScannerFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: src/scanner/
      Handler: scanner.lambda_handler
      Timeout: 30

      Environment:
        Variables:
          SECRET_ARN: !Ref SecretGuardConfigArn
          FINDINGS_TABLE: !Ref FindingsTable
          EVENT_BUS_NAME: !Ref SecretGuardBus

      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref FindingsTable

        - Statement:
            - Effect: Allow
              Action:
                - secretsmanager:GetSecretValue
              Resource: !Ref SecretGuardConfigArn

            - Effect: Allow
              Action:
                - events:PutEvents
              Resource: !GetAtt SecretGuardBus.Arn

      Events:
        RepositoryPush:
          Type: EventBridgeRule
          Properties:
            EventBusName: !Ref SecretGuardBus
            Pattern:
              source:
                - secretguard.github
              detail-type:
                - RepositoryPush

  # -----------------------------------------
  # Credential Containment
  # -----------------------------------------

  ContainmentFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: src/containment/
      Handler: app.lambda_handler

      Environment:
        Variables:
          FINDINGS_TABLE: !Ref FindingsTable
          EVENT_BUS_NAME: !Ref SecretGuardBus
          PROTECTED_USERS: !Ref ProtectedUsers

      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref FindingsTable

        - Statement:
            - Effect: Allow
              Action:
                - iam:GetAccessKeyLastUsed
                - iam:GetUser
              Resource: '*'

            - Effect: Allow
              Action:
                - iam:UpdateAccessKey
              Resource: !Sub arn:${AWS::Partition}:iam::${AWS::AccountId}:user/secretguard-managed/*

            - Effect: Allow
              Action:
                - events:PutEvents
              Resource: !GetAtt SecretGuardBus.Arn

      Events:
        SecretFinding:
          Type: EventBridgeRule
          Properties:
            EventBusName: !Ref SecretGuardBus
            Pattern:
              source:
                - secretguard.scanner
              detail-type:
                - FindingCreated

  # -----------------------------------------
  # Notification
  # -----------------------------------------

  NotifierFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: src/notifier/
      Handler: app.lambda_handler

      Environment:
        Variables:
          REMEDIATION_TOPIC_ARN: !Ref RemediationTopic

      Policies:
        - Statement:
            - Effect: Allow
              Action:
                - sns:Publish
              Resource: !Ref RemediationTopic

      Events:

        FindingCreated:
          Type: EventBridgeRule
          Properties:
            EventBusName: !Ref SecretGuardBus
            Pattern:
              source:
                - secretguard.scanner
              detail-type:
                - FindingCreated

        ContainmentCompleted:
          Type: EventBridgeRule
          Properties:
            EventBusName: !Ref SecretGuardBus
            Pattern:
              source:
                - secretguard.containment
              detail-type:
                - ContainmentCompleted

Outputs:

  WebhookUrl:
    Description: GitHub webhook URL
    Value: !Sub https://${SecretGuardApi}.execute-api.${AWS::Region}.amazonaws.com/prod/webhook

  FindingsTableName:
    Description: DynamoDB findings table
    Value: !Ref FindingsTable

  RemediationTopicArn:
    Description: SNS remediation topic
    Value: !Ref RemediationTopic

  SecretGuardBusName:
    Description: EventBridge event bus
    Value: !Ref SecretGuardBus